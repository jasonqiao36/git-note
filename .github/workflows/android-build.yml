name: Build Android APK (Xiaomi 14 Pro / HyperOS)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant (auto uses configured fixed keystore)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - debug
          - release
          - both
      create_release:
        description: 'Publish APK to GitHub Releases (direct .apk download on phone)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-apk:
    name: Build GitNote APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Could not find sdkmanager under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle (matches gradle-wrapper.properties)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare signing keystores
        id: keystores
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # NEVER generate a random keystore in CI, otherwise the signature changes on every
          # build and overwrite-installing updates on Xiaomi 14 Pro will fail!

          # 1. Fixed Debug keystore: from repo file debug.keystore.base64 OR GitHub Secret DEBUG_KEYSTORE_BASE64
          if [ -f "debug.keystore.base64" ]; then
            tr -d '\n\r ' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "has_debug_keystore=true" >> "$GITHUB_OUTPUT"
            echo "Decoded fixed debug.keystore from repository file debug.keystore.base64"
          elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > debug.keystore
            echo "has_debug_keystore=true" >> "$GITHUB_OUTPUT"
            echo "Decoded fixed debug.keystore from GitHub Secret DEBUG_KEYSTORE_BASE64"
          else
            echo "has_debug_keystore=false" >> "$GITHUB_OUTPUT"
            echo "No fixed debug keystore found (neither debug.keystore.base64 nor DEBUG_KEYSTORE_BASE64 secret)."
          fi

          # 2. Fixed Release keystore: from GitHub Secrets KEYSTORE_BASE64 + STORE_PASSWORD + KEY_PASSWORD
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > my-upload-key.jks
            echo "has_release_keystore=true" >> "$GITHUB_OUTPUT"
            echo "Decoded fixed release keystore (my-upload-key.jks) from GitHub Secrets"
          else
            echo "has_release_keystore=false" >> "$GITHUB_OUTPUT"
            echo "Release keystore secrets not configured."
          fi

      - name: Determine build targets
        id: targets
        env:
          INPUT_BUILD_TYPE: ${{ github.event.inputs.build_type }}
          HAS_DEBUG: ${{ steps.keystores.outputs.has_debug_keystore }}
          HAS_RELEASE: ${{ steps.keystores.outputs.has_release_keystore }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          BUILD_DEBUG=false
          BUILD_RELEASE=false

          if [ "$HAS_DEBUG" != "true" ] && [ "$HAS_RELEASE" != "true" ]; then
            echo "::error::No fixed signing keystore configured! To keep the APK signature fixed for overwrite updates, add GitHub Secret DEBUG_KEYSTORE_BASE64 (copy contents of debug.keystore.base64 from AI Studio) OR add Release secrets KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD (keyAlias 'upload') in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$INPUT_BUILD_TYPE" in
              auto)
                if [ "$HAS_RELEASE" = "true" ]; then
                  BUILD_RELEASE=true
                else
                  BUILD_DEBUG=true
                fi
                ;;
              debug)
                if [ "$HAS_DEBUG" != "true" ]; then
                  echo "::error::Debug build requires debug.keystore.base64 in repo or GitHub Secret DEBUG_KEYSTORE_BASE64."
                  exit 1
                fi
                BUILD_DEBUG=true
                ;;
              release)
                if [ "$HAS_RELEASE" != "true" ]; then
                  echo "::error::Release build requires fixed GitHub Secrets: KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD (keyAlias must be 'upload')."
                  exit 1
                fi
                BUILD_RELEASE=true
                ;;
              both)
                if [ "$HAS_DEBUG" = "true" ]; then
                  BUILD_DEBUG=true
                else
                  echo "::warning::Fixed debug keystore not configured; skipping Debug APK."
                fi
                if [ "$HAS_RELEASE" = "true" ]; then
                  BUILD_RELEASE=true
                else
                  echo "::warning::Release keystore secrets not configured; skipping Release APK."
                fi
                ;;
            esac
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "$HAS_RELEASE" = "true" ]; then
              BUILD_RELEASE=true
            fi
            if [ "$HAS_DEBUG" = "true" ]; then
              BUILD_DEBUG=true
            fi
          else
            if [ "$HAS_RELEASE" = "true" ]; then
              BUILD_RELEASE=true
            else
              BUILD_DEBUG=true
            fi
          fi

          echo "build_debug=$BUILD_DEBUG" >> "$GITHUB_OUTPUT"
          echo "build_release=$BUILD_RELEASE" >> "$GITHUB_OUTPUT"

          APP_VERSION_CODE="${GITHUB_RUN_NUMBER:-1}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            APP_VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            APP_VERSION_NAME="1.0.${APP_VERSION_CODE}"
          fi
          echo "app_version_code=$APP_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "app_version_name=$APP_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved APK version: versionName=${APP_VERSION_NAME}, versionCode=${APP_VERSION_CODE}"

      - name: Build Debug APK
        if: steps.targets.outputs.build_debug == 'true'
        env:
          APP_VERSION_CODE: ${{ steps.targets.outputs.app_version_code }}
          APP_VERSION_NAME: ${{ steps.targets.outputs.app_version_name }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        if: steps.targets.outputs.build_release == 'true'
        env:
          APP_VERSION_CODE: ${{ steps.targets.outputs.app_version_code }}
          APP_VERSION_NAME: ${{ steps.targets.outputs.app_version_name }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect & verify APKs (V2/V3 signature & cert check for HyperOS)
        id: package
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p dist
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION_SUFFIX="$GITHUB_REF_NAME"
          else
            VERSION_SUFFIX="build-${GITHUB_RUN_NUMBER}"
          fi

          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)"

          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            DEBUG_APK="dist/GitNote-${VERSION_SUFFIX}-debug.apk"
            cp app/build/outputs/apk/debug/app-debug.apk "$DEBUG_APK"
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --verbose --print-certs "$DEBUG_APK"
            fi
          fi

          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            RELEASE_APK="dist/GitNote-${VERSION_SUFFIX}-release.apk"
            cp app/build/outputs/apk/release/app-release.apk "$RELEASE_APK"
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK"
            fi
          fi

          ls -lh dist/

      - name: Write build summary
        if: always()
        env:
          HAS_RELEASE: ${{ steps.keystores.outputs.has_release_keystore }}
        run: |
          shopt -s nullglob
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          {
            echo "## GitNote Android APK Build Summary"
            echo ""
            echo "- **Application ID**: \`com.aistudio.gitnote.xmkpzr\`"
            echo "- **Target Device Compatibility**: Xiaomi 14 Pro (Snapdragon 8 Gen 3 / \`arm64-v8a\`, HyperOS / Android 14+)"
            echo "- **SDK**: \`minSdk 24\`, \`targetSdk 36\`, \`compileSdk 36.1\`"
            echo ""
            APKS=(dist/*.apk)
            if [ "${#APKS[@]}" -gt 0 ]; then
              echo "### Generated APKs"
              echo "| File | Size | Cert SHA-256 (fixed for overwrite updates) | File SHA-256 |"
              echo "|------|------|--------------------------------------------|--------------|"
              for f in "${APKS[@]}"; do
                SIZE="$(du -h "$f" | cut -f1)"
                FILE_SHA="$(sha256sum "$f" | cut -d' ' -f1)"
                CERT_SHA="N/A"
                if [ -n "$APKSIGNER" ]; then
                  CERT_SHA="$("$APKSIGNER" verify --print-certs "$f" 2>/dev/null | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' || echo 'N/A')"
                fi
                echo "| \`$(basename "$f")\` | ${SIZE} | \`${CERT_SHA}\` | \`${FILE_SHA}\` |"
              done
            fi
            if [ "$HAS_RELEASE" != "true" ]; then
              echo ""
              echo "> **Overwrite-Install Tip**: Debug APK is ALWAYS signed with the fixed \`debug.keystore.base64\` in this repository (never randomly regenerated), so future builds overwrite-install cleanly on your Xiaomi 14 Pro without losing data. To use your own fixed Release signing key instead, configure \`KEYSTORE_BASE64\`, \`STORE_PASSWORD\`, and \`KEY_PASSWORD\` (alias \`upload\`) in **Settings → Secrets and variables → Actions**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GitNote-APK-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}"
          name: "GitNote ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build #{0}', github.run_number) }}"
          generate_release_notes: true
          files: dist/*.apk

      - name: Clean up temporary keystores
        if: always()
        run: rm -f debug.keystore my-upload-key.jks
